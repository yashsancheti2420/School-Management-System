services:
  - type: web
    name: schoolsphere
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/schoolmanagement.db
    disk:
      name: school-data
      mountPath: /var/data
      sizeGB: 1
